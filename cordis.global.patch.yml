- id: tool-skill
  disabled: false

- id: kling-ai-remote
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: Plugin-DeepSeek-kling-ai
    transport: stdio
    command: npx
    args:
      - -y
      - mcp-remote@0.2.0
      - https://kling.ai/mcp
      - --transport
      - http-only
      - --static-oauth-client-metadata
      - '{"client_name":"Plugin-DeepSeek"}'
      - --header
      - 'X-Kling-Integration:Plugin-DeepSeek'
      - --auth-timeout
      - '180'
    toolCallTimeoutMs: 600000
    failOnStartupError: false

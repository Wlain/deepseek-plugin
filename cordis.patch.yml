- id: tool-skill
  disabled: false

- insert:
    - id: kling-ai-remote
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: kling-ai
        transport: stdio
        command: npx
        args:
          - -y
          - mcp-remote@latest
          - https://klingai.com/mcp
          - --transport
          - http-only
        toolCallTimeoutMs: 600000
        failOnStartupError: false
    - id: kling-ai-widget
      name: kling-ai-deepseek-harness
